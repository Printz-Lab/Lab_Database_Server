services:
  streamlit-db-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit-db-browser
    volumes:
    - ~/databases:/data/databases:rw
    expose:
      - "8501"
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: streamlit-nginx
    depends_on:
      - streamlit-db-browser
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped